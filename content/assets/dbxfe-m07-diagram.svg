<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 475" role="img" aria-labelledby="title desc"><title id="title">Information is not authority</title><desc id="desc">An authorized question retrieves permitted context. The model composes an answer, then evidence checks decide whether to answer or escalate. An optional tool request must pass separate identity, argument, and approval checks before an action. Missing evidence routes to a human. Text found in a document never grants tool authority.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="475" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Information is not authority</text><text x="24" y="457" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="25" y="85" width="235" height="72" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="110">Question + identity</tspan><tspan x="39" y="132">Check access scope</tspan></text><rect x="300" y="85" width="235" height="72" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="110">Retrieve context</tspan><tspan x="314" y="132">Permitted, current sources</tspan></text><rect x="300" y="205" width="235" height="72" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="230">Compose + check</tspan><tspan x="314" y="252">Grounding / uncertainty</tspan></text><rect x="25" y="345" width="235" height="82" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="370">Human escalation</tspan><tspan x="39" y="392">Missing / unsafe evidence</tspan></text><rect x="300" y="345" width="235" height="82" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="370">Answer with sources</tspan><tspan x="314" y="392">Read-only first</tspan></text><rect x="575" y="205" width="200" height="85" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="589" y="230">Optional tool request</tspan><tspan x="589" y="252">Authorize + approve</tspan></text><rect x="575" y="345" width="200" height="82" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="589" y="370">Bounded action</tspan><tspan x="589" y="392">Record outcome</tspan></text><polyline points="260,121 300,121" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="418,157 418,205" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="418,277 418,345" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="300,241 142,241 142,345" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="535,241 575,241" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="675,290 675,345" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
