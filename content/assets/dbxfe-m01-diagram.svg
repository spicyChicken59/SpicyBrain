<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Who turns uncertainty into evidence?</title><desc id="desc">The customer names the decision and accepts evidence. The account executive coordinates commercial context. The field engineer translates the decision into a technical test. A specialist validates a bounded technical claim. Delivery accepts implementation ownership only after scope and open risks are acknowledged.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="500" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Who turns uncertainty into evidence?</text><text x="24" y="482" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><text x="26" y="75" fill="#D8DFE8" font-family="sans-serif" font-size="12">ROLE</text><text x="220" y="75" fill="#D8DFE8" font-family="sans-serif" font-size="12">CONTRIBUTION</text><text x="570" y="75" fill="#D8DFE8" font-family="sans-serif" font-size="12">HANDOFF</text><rect x="24" y="95" width="170" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="38" y="120">Customer</tspan></text><rect x="220" y="95" width="320" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="234" y="120">Names outcome and constraints</tspan></text><rect x="570" y="95" width="200" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="584" y="120">Accept / pause</tspan></text><polyline points="194,123 220,123" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="540,123 570,123" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="168" width="170" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="38" y="193">Account executive</tspan></text><rect x="220" y="168" width="320" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="234" y="193">Coordinates decision context</tspan></text><rect x="570" y="168" width="200" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="584" y="193">Shared next step</tspan></text><polyline points="194,196 220,196" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="540,196 570,196" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="241" width="170" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="38" y="266">Field engineer</tspan></text><rect x="220" y="241" width="320" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="234" y="266">Designs and explains evidence</tspan></text><rect x="570" y="241" width="200" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="584" y="266">Bounded test</tspan></text><polyline points="194,269 220,269" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="540,269 570,269" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="314" width="170" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="38" y="339">Specialist</tspan></text><rect x="220" y="314" width="320" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="234" y="339">Checks uncertain claim</tspan></text><rect x="570" y="314" width="200" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="584" y="339">Qualified answer</tspan></text><polyline points="194,342 220,342" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="540,342 570,342" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="387" width="170" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="38" y="412">Delivery lead</tspan></text><rect x="220" y="387" width="320" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="234" y="412">Reviews scope and ownership</tspan></text><rect x="570" y="387" width="200" height="55" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="584" y="412">Operating plan</tspan></text><polyline points="194,415 220,415" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="540,415 570,415" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
