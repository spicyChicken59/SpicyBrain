<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc"><title id="title">A demo story with an honest recovery branch</title><desc id="desc">Begin with the customer decision and agreed synthetic input. Run the bounded demonstration. If successful, inspect the observed output against the expected result. If it fails, label the failure, use a prepared explanation, and assign verification. Both paths return to customer explain-back and the next evidence decision; the fallback never counts as a passed execution.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="600" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">A demo story with an honest recovery branch</text><text x="24" y="582" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="30" y="80" width="230" height="75" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="44" y="105">Customer decision</tspan><tspan x="44" y="127">Agree the question</tspan></text><rect x="300" y="80" width="230" height="75" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="105">Synthetic input + rule</tspan><tspan x="314" y="127">State expected result</tspan></text><rect x="300" y="210" width="230" height="70" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="235">Bounded live step</tspan></text><rect x="25" y="350" width="230" height="90" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="375">Observed output</tspan><tspan x="39" y="397">Compare actual vs expected</tspan></text><rect x="545" y="350" width="230" height="90" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="559" y="375">Failed execution</tspan><tspan x="559" y="397">Label fallback + follow-up</tspan></text><rect x="285" y="480" width="250" height="75" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="299" y="505">Customer explain-back</tspan><tspan x="299" y="527">Next evidence decision</tspan></text><polyline points="260,117 300,117" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="415,155 415,210" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="300,245 140,245 140,350" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="150" y="270" fill="#A3C4EE" font-family="sans-serif" font-size="13">succeeds</text><polyline points="530,245 660,245 660,350" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="670" y="285" fill="#A3C4EE" font-family="sans-serif" font-size="13">fails</text><polyline points="140,440 140,517 285,517" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="660,440 660,517 535,517" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
