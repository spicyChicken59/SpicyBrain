<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" role="img" aria-labelledby="title desc"><title id="title">A proof of value must permit a decision</title><desc id="desc">A customer hypothesis and measured baseline define a charter with scope, thresholds, owners, and limits. Execution produces results and exceptions. The readout compares them with the charter. Accepted evidence may justify bounded expansion; misses or blockers require revision/retest; insufficient value can justify retaining the current path or stopping.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="570" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">A proof of value must permit a decision</text><text x="24" y="552" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="25" y="75" width="230" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="100">Hypothesis + baseline</tspan><tspan x="39" y="122">What could change?</tspan></text><rect x="300" y="75" width="230" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="100">Charter</tspan><tspan x="314" y="122">Scope / criteria / owners</tspan></text><rect x="300" y="205" width="230" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="230">Test evidence</tspan><tspan x="314" y="252">Results + exceptions</tspan></text><rect x="300" y="335" width="230" height="70" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="360">Decision readout</tspan></text><rect x="25" y="460" width="220" height="65" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="485">Expand bounded scope</tspan></text><rect x="290" y="460" width="220" height="65" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="304" y="485">Revise and retest</tspan></text><rect x="555" y="460" width="220" height="65" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="569" y="485">Retain / stop</tspan></text><polyline points="255,115 300,115" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="415,155 415,205" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="415,285 415,335" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="415,405 415,430 135,430 135,460" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="415,405 400,460" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="415,430 665,430 665,460" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
