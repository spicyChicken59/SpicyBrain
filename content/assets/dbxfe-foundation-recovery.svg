<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Recover across named boundaries</title><desc id="desc">Raw evidence precedes resolution, publication and a modeled local notification. Failure after raw retention leaves the previous snapshot stale; recover recomputes and publishes 22/1. Failure after publication leaves a current report with notification pending. Snapshot-keyed local effects send nothing externally.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#416371"/></marker></defs><rect width="960" height="500" rx="16" fill="#fbfaf6"/><g font-family="Arial,sans-serif"><text x="28" y="45" font-size="25" fill="#153747">Recover across named boundaries</text><rect x="25" y="100" width="205" height="100" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="43" y="132" font-size="20" fill="#153747">1. Retain raw</text><text x="43" y="159" font-size="20" fill="#153747">Correction available</text><path d="M235 150 L270 150" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="280" y="100" width="205" height="100" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="298" y="132" font-size="20" fill="#153747">2. Resolve</text><text x="298" y="159" font-size="20" fill="#153747">Validate + reconcile</text><path d="M490 150 L525 150" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="535" y="100" width="185" height="100" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="553" y="132" font-size="20" fill="#153747">3. Publish</text><text x="553" y="159" font-size="20" fill="#153747">Named snapshot</text><path d="M725 150 L760 150" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="100" width="170" height="100" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="788" y="132" font-size="20" fill="#153747">4. Local effect</text><text x="788" y="159" font-size="20" fill="#153747">Snapshot key</text><rect x="65" y="295" width="390" height="110" rx="14" fill="#fff0d3" stroke="#55707c" stroke-width="2"/><text x="83" y="327" font-size="20" fill="#153747">Failure after 1 → previous stale</text><text x="83" y="354" font-size="20" fill="#153747">Recover from retained evidence</text><text x="83" y="381" font-size="20" fill="#153747">Expected corrected totals: 22/1</text><rect x="505" y="295" width="390" height="110" rx="14" fill="#e4f1e8" stroke="#55707c" stroke-width="2"/><text x="523" y="327" font-size="20" fill="#153747">Failure after 3 → data current</text><text x="523" y="354" font-size="20" fill="#153747">Notification may be pending</text><text x="523" y="381" font-size="20" fill="#153747">Replay effect by snapshot key</text><text x="28" y="483" font-size="15" fill="#48616b">Original teaching schematic · fictional Cinderline · 2026-09-19</text></g></svg>
