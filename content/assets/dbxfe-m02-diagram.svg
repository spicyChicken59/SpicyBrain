<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc"><title id="title">Four concerns, one discovery brief</title><desc id="desc">The supervisor contributes the operational decision, the analyst contributes the metric definition, security contributes permitted boundaries, and the sponsor contributes investment criteria. Those four inputs meet in a discovery brief containing facts, assumptions, unknowns, and accepting owners.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="440" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Four concerns, one discovery brief</text><text x="24" y="422" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="25" y="90" width="260" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="115">Supervisor</tspan><tspan x="39" y="137">Action at shift change</tspan></text><rect x="515" y="90" width="260" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="529" y="115">Analyst</tspan><tspan x="529" y="137">Metric and reconciliation</tspan></text><rect x="25" y="300" width="260" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="325">Security lead</tspan><tspan x="39" y="347">Data and network limits</tspan></text><rect x="515" y="300" width="260" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="529" y="325">Sponsor</tspan><tspan x="529" y="347">Funding decision criteria</tspan></text><rect x="290" y="200" width="220" height="82" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="304" y="225">Discovery brief</tspan><tspan x="304" y="247">Facts + gaps + owners</tspan></text><polyline points="160,170 160,240 290,240" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="645,170 645,240 510,240" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="160,300 160,260 290,260" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="645,300 645,260 510,260" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
