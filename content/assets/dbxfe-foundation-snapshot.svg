<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">One commit changes the logical snapshot</title><desc id="desc">Version 0 includes f0 containing A v1 10/1 and f1 containing C v1 8/0, totals 18/1. A commit retires f0 and adds f2 containing A v2 12/1. Version 1 reads f1 and f2, totals 20/1; physically remaining f0 is not current.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#416371"/></marker></defs><rect width="960" height="500" rx="16" fill="#fbfaf6"/><g font-family="Arial,sans-serif"><text x="28" y="45" font-size="25" fill="#153747">One commit changes the logical snapshot</text><rect x="30" y="95" width="290" height="125" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="48" y="127" font-size="20" fill="#153747">Table version 0</text><text x="48" y="154" font-size="20" fill="#153747">f0: A v1 = 10/1</text><text x="48" y="181" font-size="20" fill="#153747">f1: C v1 = 8/0</text><path d="M330 155 L400 155" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="95" width="210" height="125" rx="14" fill="#fff0d3" stroke="#55707c" stroke-width="2"/><text x="428" y="127" font-size="20" fill="#153747">Commit</text><text x="428" y="154" font-size="20" fill="#153747">Retire f0</text><text x="428" y="181" font-size="20" fill="#153747">Add f2</text><path d="M630 155 L695 155" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="705" y="95" width="225" height="125" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="723" y="127" font-size="20" fill="#153747">Table version 1</text><text x="723" y="154" font-size="20" fill="#153747">f2: A v2 = 12/1</text><text x="723" y="181" font-size="20" fill="#153747">f1: C v1 = 8/0</text><rect x="85" y="300" width="780" height="100" rx="14" fill="#f6e3e2" stroke="#55707c" stroke-width="2"/><text x="103" y="332" font-size="20" fill="#153747">f0 may remain physically present, but is not active in version 1.</text><text x="103" y="359" font-size="20" fill="#153747">Reading every file would double-count A: 30 inspected / 2 defective.</text><text x="85" y="450" font-size="20" fill="#153747">Schematic only: use supported table APIs; never edit the log.</text><text x="28" y="483" font-size="15" fill="#48616b">Original teaching schematic · fictional Cinderline · 2026-09-19</text></g></svg>
