<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-labelledby="title desc"><title id="title">Four responsibilities in an analytical path</title><desc id="desc">Approved source records enter object storage. A table format adds transaction and metadata rules over stored files. Compute reads and transforms the table into an agreed quality metric. Governance applies across access to data and workloads. A separate business-rule decision defines inspection identity, correction ordering, and units. The schematic omits cloud network wiring and is not a deployment plan.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="465" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Four responsibilities in an analytical path</text><text x="24" y="447" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="30" y="95" width="210" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="44" y="120">Source records</tspan><tspan x="44" y="142">Meaning needs validation</tspan></text><rect x="30" y="245" width="210" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="44" y="270">Object storage</tspan><tspan x="44" y="292">Holds files and logs</tspan></text><rect x="285" y="245" width="210" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="299" y="270">Table format</tspan><tspan x="299" y="292">Commits + metadata</tspan></text><rect x="540" y="245" width="225" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="554" y="270">Compute</tspan><tspan x="554" y="292">Transform + query</tspan></text><rect x="285" y="95" width="480" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="299" y="120">Governance across the path</tspan><tspan x="299" y="142">Who may use which data and operations?</tspan></text><rect x="285" y="360" width="480" height="64" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="299" y="385">Business rules: identity, ordering, units</tspan></text><polyline points="135,175 135,245" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="240,285 285,285" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="495,285 540,285" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="525,175 525,210 650,210 650,245" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="525,360 525,340 650,340 650,325" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
