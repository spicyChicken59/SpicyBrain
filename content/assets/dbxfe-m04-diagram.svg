<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Correct, quarantine, and replay</title><desc id="desc">Raw deliveries retain duplicates and corrections. The identity-and-version step collapses repeated delivery and superseded revisions. Quality validation sends accepted records to serving and invalid or ambiguous records to quarantine. The quality owner corrects the source or approves a rule, then replays retained inputs. In the synthetic example five deliveries become two valid latest inspections, with one invalid inspection quarantined.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="390" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Correct, quarantine, and replay</text><text x="24" y="372" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="25" y="95" width="220" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="120">Raw deliveries</tspan><tspan x="39" y="142">Keep event + source IDs</tspan></text><rect x="285" y="95" width="220" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="299" y="120">Identity + version</tspan><tspan x="299" y="142">Duplicates / late changes</tspan></text><rect x="550" y="95" width="225" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="564" y="120">Quality rules</tspan><tspan x="564" y="142">Valid? Conflicting?</tspan></text><rect x="550" y="255" width="225" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="564" y="280">Accepted serving</tspan><tspan x="564" y="302">A v2 + C v1 = 20 / 1</tspan></text><rect x="285" y="255" width="220" height="80" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="299" y="280">Quarantine</tspan><tspan x="299" y="302">B has negative quantity</tspan></text><rect x="25" y="255" width="220" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="280">Quality owner</tspan><tspan x="39" y="302">Correct and approve</tspan></text><polyline points="245,135 285,135" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="505,135 550,135" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="660,175 660,255" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="674" y="218" fill="#A3C4EE" font-family="sans-serif" font-size="13">valid</text><polyline points="550,155 520,155 520,235 395,235 395,255" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="221" fill="#A3C4EE" font-family="sans-serif" font-size="13">invalid / conflict</text><polyline points="285,295 245,295" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="135,255 135,175" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="150" y="220" fill="#A3C4EE" font-family="sans-serif" font-size="13">replay</text></svg>
