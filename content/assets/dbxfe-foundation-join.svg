<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Count matching pairs before aggregating</title><desc id="desc">A 12/1 and C 8/0 are two inspections. A has two tags and C one. Naive join creates three rows and 32/2 totals. An existence semijoin returns the original two inspections and 20/1 totals. Execution strategy does not correct business grain.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#416371"/></marker></defs><rect width="960" height="500" rx="16" fill="#fbfaf6"/><g font-family="Arial,sans-serif"><text x="28" y="45" font-size="25" fill="#153747">Count matching pairs before aggregating</text><rect x="30" y="95" width="245" height="115" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="48" y="127" font-size="20" fill="#153747">Inspections</text><text x="48" y="154" font-size="20" fill="#153747">A: 12/1</text><text x="48" y="181" font-size="20" fill="#153747">C: 8/0</text><rect x="355" y="95" width="245" height="115" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="373" y="127" font-size="20" fill="#153747">Tags</text><text x="373" y="154" font-size="20" fill="#153747">A: two matches</text><text x="373" y="181" font-size="20" fill="#153747">C: one match</text><path d="M610 155 L680 155" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="690" y="95" width="240" height="115" rx="14" fill="#f6e3e2" stroke="#55707c" stroke-width="2"/><text x="708" y="127" font-size="20" fill="#153747">Naive inner join</text><text x="708" y="154" font-size="20" fill="#153747">A, A, C</text><text x="708" y="181" font-size="20" fill="#153747">Totals: 32/2</text><path d="M480 220 L480 280" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="295" y="295" width="375" height="95" rx="14" fill="#e4f1e8" stroke="#55707c" stroke-width="2"/><text x="313" y="327" font-size="20" fill="#153747">Existence requirement: left semi</text><text x="313" y="354" font-size="20" fill="#153747">A, C → correct totals: 20/1</text><text x="95" y="450" font-size="20" fill="#153747">Inspect plan movement separately: a fast wrong aggregate is still wrong.</text><text x="28" y="483" font-size="15" fill="#48616b">Original teaching schematic · fictional Cinderline · 2026-09-19</text></g></svg>
