<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Invalid latest state is unresolved, not older truth</title><desc id="desc">A v2 12/1 is valid. A v3 null/1 is newer but invalid. Filtering first would resurrect v2 incorrectly. Retain both; mark A unresolved, block new publication and label any last verified snapshot stale. Baseline-only invalid B remains separately disclosed exclusion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#416371"/></marker></defs><rect width="960" height="500" rx="16" fill="#fbfaf6"/><g font-family="Arial,sans-serif"><text x="28" y="45" font-size="25" fill="#153747">Invalid latest state is unresolved, not older truth</text><rect x="30" y="100" width="260" height="100" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="48" y="132" font-size="20" fill="#153747">Retained A v2</text><text x="48" y="159" font-size="20" fill="#153747">12 inspected / 1 defect</text><path d="M300 150 L365 150" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="375" y="100" width="255" height="100" rx="14" fill="#f6e3e2" stroke="#55707c" stroke-width="2"/><text x="393" y="132" font-size="20" fill="#153747">Arriving A v3</text><text x="393" y="159" font-size="20" fill="#153747">null inspected / 1 defect</text><path d="M640 150 L695 150" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="705" y="100" width="225" height="100" rx="14" fill="#fff0d3" stroke="#55707c" stroke-width="2"/><text x="723" y="132" font-size="20" fill="#153747">A unresolved</text><text x="723" y="159" font-size="20" fill="#153747">No fallback to v2</text><rect x="70" y="290" width="370" height="115" rx="14" fill="#f6e3e2" stroke="#55707c" stroke-width="2"/><text x="88" y="322" font-size="20" fill="#153747">Candidate accepted state: C</text><text x="88" y="349" font-size="20" fill="#153747">Diagnostic totals: 8/0</text><text x="88" y="376" font-size="20" fill="#153747">Not a current report</text><rect x="510" y="290" width="380" height="115" rx="14" fill="#fff0d3" stroke="#55707c" stroke-width="2"/><text x="528" y="322" font-size="20" fill="#153747">Last verified snapshot</text><text x="528" y="349" font-size="20" fill="#153747">A v2 + C = 20/1</text><text x="528" y="376" font-size="20" fill="#153747">Label: stale / previous</text><text x="28" y="483" font-size="15" fill="#48616b">Original teaching schematic · fictional Cinderline · 2026-09-19</text></g></svg>
