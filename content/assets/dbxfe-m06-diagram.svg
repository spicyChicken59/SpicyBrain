<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc"><title id="title">AWS compute choices cross different boundaries</title><desc id="desc">A user or workload identity requests work through Databricks-managed control services. In the classic alternative, compute runs inside the customer AWS account. In the serverless alternative, compute runs in a Databricks-managed plane. Both may access customer data resources through separately approved paths. Identity privileges and network conditions must be validated on the chosen path; the schematic is not an approved network configuration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="580" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">AWS compute choices cross different boundaries</text><text x="24" y="562" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="245" y="70" width="310" height="64" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="259" y="95">User / workload identity</tspan></text><rect x="245" y="175" width="310" height="64" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="259" y="200">Databricks control services</tspan></text><rect x="25" y="300" width="325" height="85" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="325">Classic alternative</tspan><tspan x="39" y="347">Compute in customer AWS account</tspan></text><rect x="450" y="300" width="325" height="85" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="464" y="325">Serverless alternative</tspan><tspan x="464" y="347">Databricks-managed compute</tspan></text><rect x="245" y="460" width="310" height="75" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="259" y="485">Customer data resources</tspan><tspan x="259" y="507">Approved identity + network path</tspan></text><polyline points="400,134 400,175" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="400,239 400,267 188,267 188,300" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="400,267 612,267 612,300" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="188,385 188,495 245,495" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="612,385 612,495 555,495" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="428" fill="#D8DFE8" font-family="sans-serif" font-size="14">Customer ownership / operation</text><text x="450" y="428" fill="#D8DFE8" font-family="sans-serif" font-size="14">Managed boundary / verify availability</text></svg>
