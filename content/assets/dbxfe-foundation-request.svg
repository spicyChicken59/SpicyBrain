<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Follow the request; keep ownership separate</title><desc id="desc">An analyst uses the workspace entry point, compute executes the request, and governed access reaches a committed table. Classic AWS compute is in the customer account; serverless compute is in a Databricks-managed plane. Durable storage is separate from session memory.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#416371"/></marker></defs><rect width="960" height="500" rx="16" fill="#fbfaf6"/><g font-family="Arial,sans-serif"><text x="28" y="45" font-size="25" fill="#153747">Follow the request; keep ownership separate</text><rect x="30" y="95" width="240" height="105" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="48" y="127" font-size="20" fill="#153747">Analyst + workspace</text><text x="48" y="154" font-size="20" fill="#153747">Saved query definition</text><path d="M275 145 L350 145" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="95" width="250" height="105" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="378" y="127" font-size="20" fill="#153747">Compute executes</text><text x="378" y="154" font-size="20" fill="#153747">Identity + permissions</text><path d="M615 145 L695 145" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="705" y="95" width="230" height="105" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="723" y="127" font-size="20" fill="#153747">Committed table</text><text x="723" y="154" font-size="20" fill="#153747">Durable storage</text><rect x="80" y="275" width="350" height="100" rx="14" fill="#e9e5f3" stroke="#55707c" stroke-width="2"/><text x="98" y="307" font-size="20" fill="#153747">Classic compute</text><text x="98" y="334" font-size="20" fill="#153747">Customer AWS account</text><rect x="510" y="275" width="350" height="100" rx="14" fill="#e9e5f3" stroke="#55707c" stroke-width="2"/><text x="528" y="307" font-size="20" fill="#153747">Serverless compute</text><text x="528" y="334" font-size="20" fill="#153747">Databricks-managed plane</text><text x="80" y="435" font-size="20" fill="#153747">Stopping a session is different from deleting durable table data.</text><text x="28" y="483" font-size="15" fill="#48616b">Original teaching schematic · fictional Cinderline · 2026-09-19</text></g></svg>
