<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Value depends on more than a price tag</title><desc id="desc">The benefit hypothesis is hours released per week times working weeks times a stated hourly value, adjusted for whether the benefit is realized. The cost side includes recurring usage and operations plus one-time implementation and transition. Year-one net is benefit minus both cost categories. At 10 hours, 48 weeks, 60 dollars per hour, 12000 recurring and 15000 implementation, the illustrative net is 1800 dollars; at 5 hours it is negative 12600.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="520" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Value depends on more than a price tag</text><text x="24" y="502" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="25" y="85" width="350" height="100" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="110">Benefit hypothesis</tspan><tspan x="39" y="132">Hours × weeks × hourly value</tspan><tspan x="39" y="154">Realization still needs evidence</tspan></text><rect x="425" y="85" width="350" height="100" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="439" y="110">Cost basis</tspan><tspan x="439" y="132">Recurring + implementation</tspan><tspan x="439" y="154">Include relevant omitted items</tspan></text><rect x="25" y="245" width="350" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="270">10 × 48 × $60 = $28,800</tspan><tspan x="39" y="292">Hypothetical labor value</tspan></text><rect x="425" y="245" width="350" height="80" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="439" y="270">$12,000 + $15,000 = $27,000</tspan><tspan x="439" y="292">Hypothetical year-one cost</tspan></text><rect x="235" y="390" width="330" height="80" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="249" y="415">Illustrative year-one net: $1,800</tspan><tspan x="249" y="437">At 5 hours/week: -$12,600</tspan></text><polyline points="200,185 200,245" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="600,185 600,245" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="200,325 200,365 340,365 340,390" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="600,325 600,365 460,365 460,390" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
