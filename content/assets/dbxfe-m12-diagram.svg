<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 535" role="img" aria-labelledby="title desc"><title id="title">Keep the account decision moving</title><desc id="desc">A current customer decision is reviewed against the evidence available. Resolved evidence supports a next commitment. Open material risks go to a named owner and a specific question. The owner returns evidence or a blocker by an agreed update. The account team revisits the decision and records what changed. Low-impact work is deferred when it does not reduce a material uncertainty.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="535" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Keep the account decision moving</text><text x="24" y="517" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="250" y="75" width="300" height="75" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="264" y="100">Current customer decision</tspan><tspan x="264" y="122">What must be known?</tspan></text><rect x="25" y="225" width="260" height="85" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="250">Available evidence</tspan><tspan x="39" y="272">Observed / accepted / limits</tspan></text><rect x="515" y="225" width="260" height="85" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="529" y="250">Open material risk</tspan><tspan x="529" y="272">Question + owner + date</tspan></text><rect x="250" y="395" width="300" height="85" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="264" y="420">Next evidence or blocker</tspan><tspan x="264" y="442">Update the decision record</tspan></text><polyline points="400,150 400,187 155,187 155,225" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="400,187 645,187 645,225" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="155,310 155,437 250,437" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="645,310 645,437 550,437" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="400,395 400,330 480,330 480,150" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="414" y="352" fill="#A3C4EE" font-family="sans-serif" font-size="13">revisit</text></svg>
