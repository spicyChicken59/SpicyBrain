<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Which part of the wait is growing?</title><desc id="desc">Start with end-to-end latency. If waiting is dominant, inspect concurrency and capacity. If execution is dominant, inspect operator evidence, join growth, scans, spills, and skew. If result delivery or rendering is dominant, inspect result size and client behavior. Every branch returns to a controlled rerun with the same workload basis.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="500" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Which part of the wait is growing?</text><text x="24" y="482" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="240" y="75" width="320" height="65" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="254" y="100">End-to-end delay increases</tspan></text><rect x="25" y="210" width="230" height="100" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="235">Waiting dominates</tspan><tspan x="39" y="257">Queue / concurrency</tspan><tspan x="39" y="279">Capacity conditions</tspan></text><rect x="285" y="210" width="230" height="100" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="299" y="235">Execution dominates</tspan><tspan x="299" y="257">Join / scan / spill</tspan><tspan x="299" y="279">Query and data layout</tspan></text><rect x="545" y="210" width="230" height="100" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="559" y="235">Delivery dominates</tspan><tspan x="559" y="257">Result size / client</tspan><tspan x="559" y="279">Render and transfer</tspan></text><rect x="200" y="395" width="400" height="65" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="214" y="420">One hypothesis → controlled rerun</tspan></text><polyline points="400,140 400,175 140,175 140,210" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="400,140 400,210" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="400,175 660,175 660,210" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="140,310 140,365 300,365 300,395" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="400,310 400,395" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="660,310 660,365 500,365 500,395" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
