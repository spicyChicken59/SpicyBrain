<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">A name locates; privileges authorize</title><desc id="desc">Metastore contains catalog quality, schema reporting and table daily_rate. Basic reader access needs USE CATALOG, USE SCHEMA and SELECT plus the stated execution/path assumptions. Identity and network reachability are distinct checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#416371"/></marker></defs><rect width="960" height="500" rx="16" fill="#fbfaf6"/><g font-family="Arial,sans-serif"><text x="28" y="45" font-size="25" fill="#153747">A name locates; privileges authorize</text><rect x="35" y="90" width="260" height="70" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="53" y="122" font-size="20" fill="#153747">Metastore</text><path d="M165 165 L165 205" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="35" y="215" width="260" height="70" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="53" y="247" font-size="20" fill="#153747">Catalog: quality</text><path d="M300 250 L350 250" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="360" y="215" width="250" height="70" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="378" y="247" font-size="20" fill="#153747">Schema: reporting</text><path d="M615 250 L665 250" fill="none" stroke="#416371" stroke-width="3" marker-end="url(#arrow)"/><rect x="675" y="215" width="250" height="70" rx="14" fill="#e7f0f4" stroke="#55707c" stroke-width="2"/><text x="693" y="247" font-size="20" fill="#153747">Table: daily_rate</text><text x="50" y="335" font-size="20" fill="#153747">USE CATALOG</text><text x="380" y="335" font-size="20" fill="#153747">USE SCHEMA</text><text x="700" y="335" font-size="20" fill="#153747">SELECT</text><rect x="100" y="390" width="760" height="62" rx="14" fill="#fff0d3" stroke="#55707c" stroke-width="2"/><text x="118" y="422" font-size="20" fill="#153747">Verify the actual reader and context; a route is not an access grant.</text><text x="28" y="483" font-size="15" fill="#48616b">Original teaching schematic · fictional Cinderline · 2026-09-19</text></g></svg>
