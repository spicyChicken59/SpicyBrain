<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Move one slice, keep a way back</title><desc id="desc">The source feeds both the current report and a proposed one-plant target path during a bounded comparison. Reconciliation checks keys, totals, timing, and corrections. If accepted, an owner approves cutover and keeps a recovery window. If rejected, the target is corrected while the current report remains active. Rollback after cutover returns to the maintained path under named triggers.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#A3C4EE"/></marker></defs><rect width="800" height="450" rx="8" fill="#111F31"/><text x="24" y="34" fill="#D8DFE8" font-family="sans-serif" font-size="21">Move one slice, keep a way back</text><text x="24" y="432" fill="#D8DFE8" font-family="sans-serif" font-size="12">Original teaching schematic · fictional example · not product UI</text><rect x="25" y="70" width="220" height="70" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="95">Approved source</tspan><tspan x="39" y="117">Same input basis</tspan></text><rect x="300" y="70" width="210" height="70" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="95">Current report</tspan><tspan x="314" y="117">Keep usable</tspan></text><rect x="300" y="205" width="210" height="70" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="314" y="230">One-plant target</tspan><tspan x="314" y="252">Versioned transform</tspan></text><rect x="560" y="145" width="215" height="95" rx="7" fill="#371F18" stroke="#FE825C"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="574" y="170">Reconciliation gate</tspan><tspan x="574" y="192">Keys + totals + timing</tspan><tspan x="574" y="214">Owner accepts?</tspan></text><rect x="560" y="325" width="215" height="70" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="574" y="350">Cutover + monitoring</tspan><tspan x="574" y="372">Recovery window</tspan></text><rect x="25" y="325" width="220" height="70" rx="7" fill="#19273A" stroke="#4682CC"/><text fill="#F4F7FB" font-family="sans-serif" font-size="16"><tspan x="39" y="350">Rollback / retain</tspan><tspan x="39" y="372">Named decision owner</tspan></text><polyline points="245,105 300,105" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="135,140 135,240 300,240" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="510,105 665,105 665,145" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="510,240 535,240 535,205 560,205" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><polyline points="665,240 665,325" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="677" y="285" fill="#A3C4EE" font-family="sans-serif" font-size="13">accepted</text><polyline points="560,175 535,175 535,155 410,155 410,140" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="175" fill="#A3C4EE" font-family="sans-serif" font-size="13">not accepted</text><polyline points="560,360 245,360" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/><text x="335" y="349" fill="#A3C4EE" font-family="sans-serif" font-size="13">trigger breached</text><polyline points="135,325 135,165 400,165 400,140" fill="none" stroke="#A3C4EE" stroke-width="2" marker-end="url(#arrow)"/></svg>
