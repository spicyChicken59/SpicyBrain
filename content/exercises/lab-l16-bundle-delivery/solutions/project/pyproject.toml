# Cinderline scrap-summary project (synthetic teaching project for Lab L16).
# The wheel this file describes is built by the bundle's artifact step during
# `databricks bundle deploy`; that build was NOT RUN in the lab.

[project]
name = "cinderline_quality"
version = "0.3.0"
description = "Scrap-rate rules and the entry point of Cinderline's scrap-summary job (fictional)."
requires-python = ">=3.12,<3.13"
# The package itself needs only the standard library. Anything added here is
# pinned with == so that every build of one commit resolves the same versions.
dependencies = []

[project.scripts]
# The job's python_wheel_task names this entry point (resources/scrap_job.yml).
scrap_summary = "cinderline_quality.main:main"

[build-system]
# Pinned build backend; recorded for the delivery pipeline, not exercised here.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
