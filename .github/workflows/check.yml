name: SpicyBrain acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: spicybrain-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepare:content
      - run: npm run check
      - name: Build nested-path artifact
        run: npm run build
        env:
          APP_BASE: /SpicyBrain/
          APP_OUT: dist-nested
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:content-extension
      - name: Exact tested commit and runtime
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/tested-head.txt
          node --version > test-results/node-version.txt
          npx playwright --version > test-results/playwright-version.txt
      - name: Public-safe synthetic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-acceptance-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/
            playwright-report/
            docs/evidence/content-extension.json
            docs/evidence/extension-review.png
          retention-days: 14
