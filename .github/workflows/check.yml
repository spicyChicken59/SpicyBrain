name: SpicyBrain acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: spicybrain-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - name: Clean install without lifecycle-generated files
        run: npm ci --ignore-scripts
      - name: Fresh-checkout acceptance (check generates its own content)
        run: |
          test ! -e src/generated/catalog.json
          test ! -e src/generated/search.json
          npm run check
      - name: Build nested-path artifact
        run: npm run build
        env:
          APP_BASE: /SpicyBrain/
          APP_OUT: dist-nested
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:content-extension
      - name: Source and media availability (distinct from editorial verification)
        run: npm run report:sources
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute authored Python and Spark exercises
        run: |
          python -m pip install -r content/exercises/reliable-data/requirements.txt
          python content/exercises/reliable-data/run_tests.py --spark --evidence docs/evidence/reliable-data-ci.json
      - name: Exact tested commit and runtime
        if: always()
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/tested-head.txt
          node --version > test-results/node-version.txt
          npx playwright --version > test-results/playwright-version.txt
      - name: Public-safe synthetic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-acceptance-${{ github.event.pull_request.head.sha }}
          path: |
            test-results/
            playwright-report/
            docs/evidence/content-extension.json
            docs/evidence/extension-review.png
            docs/evidence/reliable-data-ci.json
            docs/evidence/source-availability.json
          retention-days: 14
